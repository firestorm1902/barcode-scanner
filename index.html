<script>
(function () {
  const local = ['./zxing.min.js', './index_min.js', './zxing_min.js'];
  const cdn = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
  const ok = () => !!(window.ZXing && window.ZXing.MultiFormatReader);
  const inject = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = () => res(); s.onerror = () => { s.remove(); rej(); };
    document.head.appendChild(s);
  });
  window.__zxReady = (async () => {
    for (const src of local) { try { await inject(src); if (ok()) return true; } catch (e) {} }
    try { await inject(cdn); } catch (e) {}
    return ok();
  })();
})();
</script>
<style>
:root{--bg:#eef2f1;--ink:#16222e;--mu:#5d6b78;--line:#c9d3d1;--pen:#c1272d;--pet:#0b6e69;--amb:#9a5b00;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px 14px 80px;line-height:1.35}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.02rem;font-weight:700;margin-bottom:8px}
nav{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
nav button{border:0;background:transparent;color:var(--ink);font:600 .9rem/1 inherit;font-family:inherit;padding:9px 14px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--white)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pet);outline-offset:2px}
section{border-top:1.5px solid var(--ink);padding-top:10px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-head b{font-size:1.15rem}
.day-head span{color:var(--mu);font-size:.9rem}
.vp{position:relative;aspect-ratio:4/3;background:#0b1218;border-radius:12px;overflow:hidden}
.cam,.cam video{width:100%;height:100%}
.cam video{object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;color:#c8d3d9;background:#0b1218}
.ph b{color:#fff;font-size:1.1rem}
.ph span{font-size:.88rem;max-width:280px}
.frame{position:absolute;left:8%;right:8%;top:20%;bottom:20%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(11,18,24,.45);pointer-events:none}
.frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--pen)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.b{font:600 .95rem/1.2 inherit;font-family:inherit;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);border-radius:10px;padding:11px 14px;cursor:pointer}
.b.pri{background:var(--pet);border-color:var(--pet);color:#fff}
.b.grow{flex:1}
.b.dng{border-color:var(--pen);color:var(--pen)}
.b.sm{padding:7px 10px;font-size:.84rem}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.45}
.note{border-left:4px solid var(--amb);background:#f8ecd6;padding:10px 12px;border-radius:0 8px 8px 0;font-size:.9rem}
.note.ok{border-color:var(--pet);background:#d8eeeb}
.note.bad{border-color:var(--pen);background:#f6dcdc}
.last{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--pet);background:#d8eeeb;border-radius:12px;padding:12px 14px}
.last.unk{border-color:var(--amb);background:#f8ecd6}
.last b{font-size:1.1rem;display:block}
.last span{font-size:.88rem;color:var(--mu)}
.dr{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dr .nm b{font-size:1.02rem}
.dr .nm small{display:block;color:var(--mu);font-size:.8rem}
.dr .nm small.low{color:var(--pen);font-weight:700}
.tl{grid-column:1 / -1;color:var(--pen);display:flex;flex-wrap:wrap;gap:6px}
.tl:empty{display:none}
.cnt{font-size:1.5rem;font-weight:800;min-width:32px;text-align:right}
.empty{color:var(--mu);padding:14px 0;font-size:.92rem}
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-weight:600;color:var(--mu);text-align:right;padding:4px 5px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
td.bad{color:var(--pen);font-weight:700}td.good{color:var(--pet);font-weight:700}td.warn{color:var(--amb);font-weight:700}
tfoot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--ink)}
input,select{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--white);color:var(--ink);width:100%}
input.n{width:54px;text-align:right;padding:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{font-size:.78rem;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.full{grid-column:1 / -1}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem}
.chk input{width:auto}
.pc{border-bottom:1px solid var(--line);padding:10px 0}
.pc summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none}
.pc summary::-webkit-details-marker{display:none}
.pc summary small{color:var(--mu)}
.pc .grid2{margin-top:8px}
.rw{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.rw span:nth-child(2){flex:1;font-weight:600}
.rw small{color:var(--mu)}
.daylist .rw span:nth-child(2){font-weight:400}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;border:1.5px solid currentColor}
.tag.act{color:var(--pet)}.tag.cls{color:var(--mu)}

/* Sheet für Admin-Scan */
.sheet{position:fixed;inset:0;background:rgba(11,18,24,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:640px;max-height:96vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet .vp{aspect-ratio:16/9}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-top b{font-size:1.05rem}
.mode{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.mode button{border:0;background:transparent;font:600 .84rem/1 inherit;font-family:inherit;padding:8px 10px;color:var(--ink);cursor:pointer}
.mode button.on{background:var(--ink);color:#fff}
.prod{border:2px solid var(--pet);background:var(--white);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prod-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod-h b{font-size:1.15rem}
.prod-h span{font-size:.9rem;color:var(--mu)}
.prod-h span strong{color:var(--ink);font-size:1.25rem}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.packs .b{padding:14px 8px;font-size:1rem}
.packs .b small{display:block;font-weight:500;font-size:.78rem;color:var(--mu);margin-top:2px}
.packs.minus .b{border-color:var(--pen);color:var(--pen)}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,90px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;transition:transform .2s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <h1>Strichliste</h1>
    <nav><button data-v="scan" class="on">Scannen</button><button data-v="admin">Admin</button></nav>
  </header>

  <main id="v-scan" style="display:flex;flex-direction:column;gap:16px">
    <div id="dayInfo"></div>
    <section style="border-top:0;padding-top:0" id="scanSec">
      <div class="vp">
        <div class="cam" id="camMain"></div>
        <div class="frame" id="frameMain" hidden></div>
        <div class="ph" id="phMain"><b>Getränk scannen</b><span>Kamera starten und den Barcode waagerecht in die Mitte halten.</span></div>
      </div>
      <div class="row">
        <button class="b pri grow" id="startBtn">Kamera starten</button>
        <button class="b grow" id="stopBtn" hidden>Kamera stoppen</button>
      </div>
    </section>
    <div class="note" id="msg" hidden></div>
    <div id="last" hidden></div>
    <section id="listSec"><h2>Getränke heute</h2><div id="list"></div></section>
  </main>

  <main id="v-admin" hidden><div id="adminBody" style="display:flex;flex-direction:column;gap:18px"></div></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-top">
      <b id="sheetTitle">Einladen</b>
      <button class="b sm" id="sheetClose">Fertig</button>
    </div>
    <div class="mode" id="sheetMode" hidden>
      <button data-m="load" class="on">Mitgenommen</button><button data-m="count">Rest gezählt</button>
    </div>
    <div class="vp">
      <div class="cam" id="camSheet"></div>
      <div class="frame" id="frameSheet" hidden></div>
      <div class="ph" id="phSheet"><b>Kamera startet …</b></div>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<input type="file" id="fileIn" accept="application/json,.json" hidden />
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'strichliste_v2';
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* =========================================================
   Daten
   products: {id,name,codes[],price,packs:[{l,n}]}
   days:     {id,date,place,note,closed,load:{pid:n},count:{pid:n},log:[{id,t,p,k,d}]}
   scans:    {id,t,day,p,src}
   ========================================================= */
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function migrateV1() {
  try {
    const o = JSON.parse(localStorage.getItem('strichliste_v1'));
    if (!o || !Array.isArray(o.drinks) || !o.drinks.length) return null;
    const day = { id: uid(), date: todayISO(), place: 'Übernommen', note: '', closed: false, load: {}, count: {}, log: [] };
    const products = o.drinks.map(d => { if (d.start) day.load[d.id] = d.start; if (d.counted != null) day.count[d.id] = d.counted; return { id: d.id, name: d.name, codes: d.codes || [], price: d.price || 0, packs: [] }; });
    return { v: 2, pin: o.pin || '1234', products, days: [day], scans: (o.scans || []).map(s => ({ id: s.id, t: s.t, day: day.id, p: s.d, src: s.src || 'scan' })), active: day.id };
  } catch (e) { return null; }
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.products)) return Object.assign({ pin: '1234', days: [], scans: [], active: null }, d); } catch (e) {}
  return migrateV1() || { v: 2, pin: '1234', products: [], days: [], scans: [], active: null };
}
let db = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Speichern fehlgeschlagen – Speicher voll?'); } }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => parseFloat(String(v).replace(',', '.'));
const money = n => (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const norm = c => { c = String(c).trim(); return /^\d+$/.test(c) ? c.replace(/^0+(?=\d)/, '') : c; };
const P = id => db.products.find(p => p.id === id);
const D = id => db.days.find(d => d.id === id);
const byCode = code => db.products.find(p => p.codes.includes(norm(code)));
const fmtDate = iso => { const [y, m, d] = iso.split('-'); return new Date(+y, m - 1, +d).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }); };
const fmtTime = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const dayLabel = d => fmtDate(d.date) + (d.place ? ' – ' + d.place : '');
const sortedDays = () => db.days.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

const loaded = (day, pid) => day.load[pid] || 0;
const used = (day, pid) => db.scans.reduce((a, s) => a + (s.day === day.id && s.p === pid ? 1 : 0), 0);
const counted = (day, pid) => (day.count[pid] == null ? null : day.count[pid]);
const soll = (day, pid) => loaded(day, pid) - used(day, pid);

function dayRows(day) {
  const ids = new Set(Object.keys(day.load).filter(k => day.load[k] > 0));
  db.scans.forEach(s => { if (s.day === day.id) ids.add(s.p); });
  Object.keys(day.count).forEach(k => { if (day.count[k] != null) ids.add(k); });
  return db.products.filter(p => ids.has(p.id)).map(p => {
    const l = loaded(day, p.id), u = used(day, p.id), s = l - u, c = counted(day, p.id);
    return { p, l, u, s, c, diff: c == null ? null : c - s };
  });
}

function parsePacks(txt) {
  const out = [];
  String(txt || '').split(/[;\n]+/).forEach(part => {
    const m = part.trim().match(/^(.*?)\s*(\d+)\s*(?:er|x|fl\.?|flaschen)?\s*$/i);
    if (m && +m[2] > 1) out.push({ l: m[1].trim() || 'Kasten', n: +m[2] });
  });
  return out;
}
const packsText = packs => (packs || []).map(k => k.l + ' ' + k.n).join('; ');
function parseCodes(txt, self) {
  const list = [...new Set(String(txt || '').split(/[,;\s]+/).map(norm).filter(Boolean))], ok = [];
  list.forEach(c => { const o = byCode(c); if (o && o !== self) toast('Barcode ' + c + ' gehört schon zu „' + o.name + '“'); else ok.push(c); });
  return ok;
}

let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

function tally(n) {
  if (n <= 0 || n > 60) return '';
  const grp = k => {
    let s = '<svg viewBox="0 0 28 22" width="28" height="22" aria-hidden="true"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">';
    for (let i = 0; i < Math.min(k, 4); i++) s += '<line x1="' + (4 + i * 6.5) + '" y1="2" x2="' + (4 + i * 6.5) + '" y2="20"/>';
    if (k === 5) s += '<line x1="1" y1="17" x2="27" y2="5"/>';
    return s + '</g></svg>';
  };
  let h = ''; for (let i = 0; i < Math.floor(n / 5); i++) h += grp(5);
  return h + (n % 5 ? grp(n % 5) : '');
}

/* =========================================================
   Kamera / Scanner (ZXing auf Video-Frames, einer für alles)
   ========================================================= */
const cam = { stream: null, video: null, timer: null, on: false, tk: 0, zx: null, nat: null, cv: null, cx: null, handler: null, box: null, lastCode: '', lastT: 0 };
function buildReader() {
  if (!(window.ZXing && ZXing.MultiFormatReader)) return null;
  const Z = ZXing, h = new Map(), B = Z.BarcodeFormat;
  h.set(Z.DecodeHintType.TRY_HARDER, true);
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [B.QR_CODE, B.EAN_13, B.EAN_8, B.UPC_A, B.UPC_E, B.CODE_128, B.CODE_39, B.CODE_93, B.ITF, B.DATA_MATRIX, B.AZTEC, B.PDF_417]);
  const r = new Z.MultiFormatReader(); r.setHints(h); return r;
}
function zxFrame() {
  const v = cam.video, vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return null;
  const cw = Math.floor(vw * 0.9), ch = Math.floor(vh * 0.6), sx = Math.floor((vw - cw) / 2), sy = Math.floor((vh - ch) / 2);
  const k = Math.min(1, 1100 / cw), ow = Math.max(1, Math.floor(cw * k)), oh = Math.max(1, Math.floor(ch * k));
  if (!cam.cv) { cam.cv = document.createElement('canvas'); cam.cx = cam.cv.getContext('2d', { willReadFrequently: true }); }
  if (cam.cv.width !== ow || cam.cv.height !== oh) { cam.cv.width = ow; cam.cv.height = oh; }
  cam.cx.drawImage(v, sx, sy, cw, ch, 0, 0, ow, oh);
  const Z = ZXing, src = new Z.HTMLCanvasElementLuminanceSource(cam.cv), Bin = cam.tk % 2 ? Z.GlobalHistogramBinarizer : Z.HybridBinarizer;
  try { const r = cam.zx.decode(new Z.BinaryBitmap(new Bin(src))); if (r && r.getText()) return r.getText(); } catch (e) {}
  return null;
}
async function camTick() {
  cam.timer = null; if (!cam.on || !cam.video) return; cam.tk++;
  try {
    if (cam.video.readyState >= 2 && cam.video.videoWidth > 0) {
      let code = null;
      if (cam.nat) { try { const d = await cam.nat.detect(cam.video); if (d && d.length && d[0].rawValue) code = d[0].rawValue; } catch (e) {} }
      if (!code && cam.zx) code = zxFrame();
      if (code) {
        code = norm(code);
        const now = Date.now();
        if (!(code === cam.lastCode && now - cam.lastT < 2500)) {
          cam.lastCode = code; cam.lastT = now;
          beep(); if (navigator.vibrate) navigator.vibrate(60);
          if (cam.handler) cam.handler(code);
        } else cam.lastT = now;
      }
    }
  } catch (e) {}
  if (cam.on) cam.timer = setTimeout(camTick, 120);
}
async function openStream() {
  const base = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  const tries = [{ video: Object.assign({ facingMode: { ideal: 'environment' } }, base), audio: false }, { video: { facingMode: 'environment' }, audio: false }, { video: true, audio: false }];
  let err; for (const c of tries) { try { return await navigator.mediaDevices.getUserMedia(c); } catch (e) { err = e; } }
  throw err;
}
// box = {cam, frame, ph}; liefert Fehlermeldung oder null
async function camStart(box, handler) {
  camStop();
  cam.handler = handler; cam.box = box;
  await window.__zxReady;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return '<b>Kein Kamerazugriff:</b> Die Seite muss über HTTPS direkt in Safari oder Chrome geöffnet werden.';
  cam.zx = buildReader(); cam.nat = null;
  if (!IS_IOS && 'BarcodeDetector' in window) { try { cam.nat = new BarcodeDetector(); } catch (e) {} }
  if (!cam.zx && !cam.nat) return '<b>Scanner-Bibliothek fehlt:</b> Lege <code>index_min.js</code> (ZXing) neben diese Datei oder prüfe die Internetverbindung.';
  try {
    cam.stream = await openStream();
    if (cam.box !== box) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; return null; }
    const v = document.createElement('video');
    v.setAttribute('playsinline', 'true'); v.muted = true; v.autoplay = true; v.srcObject = cam.stream;
    box.cam.innerHTML = ''; box.cam.appendChild(v); cam.video = v;
    await v.play();
    try { const t = cam.stream.getVideoTracks()[0], c = t.getCapabilities ? t.getCapabilities() : {}; if (c.focusMode && c.focusMode.includes('continuous')) await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    cam.on = true; cam.tk = 0; cam.lastCode = '';
    box.ph.hidden = true; box.frame.hidden = false;
    cam.timer = setTimeout(camTick, 200);
    return null;
  } catch (e) {
    camStop();
    return '<b>Kamera nicht verfügbar (' + esc((e && e.name) || 'Fehler') + '):</b> Erlaubnis prüfen (iPhone: Einstellungen → Safari → Kamera) und die Seite direkt im Browser öffnen.';
  }
}
function camStop() {
  cam.on = false; clearTimeout(cam.timer); cam.timer = null;
  if (cam.stream) { cam.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); cam.stream = null; }
  if (cam.video) { try { cam.video.pause(); cam.video.srcObject = null; } catch (e) {} cam.video.remove(); cam.video = null; }
  if (cam.box) { cam.box.ph.hidden = false; cam.box.frame.hidden = true; }
  cam.box = null; cam.handler = null;
}
function beep() {
  try { const A = window.AudioContext || window.webkitAudioContext; if (!beep.c) beep.c = new A(); const c = beep.c, o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 1046; g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .14);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .14); } catch (e) {}
}
const boxMain = { cam: $('camMain'), frame: $('frameMain'), ph: $('phMain') };
const boxSheet = { cam: $('camSheet'), frame: $('frameSheet'), ph: $('phSheet') };

/* =========================================================
   Scan-Ansicht (Mitglieder)
   ========================================================= */
function setMsg(t) { $('msg').hidden = !t; $('msg').innerHTML = t || ''; }
function setMainButtons() { $('startBtn').hidden = cam.on && cam.box === boxMain; $('stopBtn').hidden = !(cam.on && cam.box === boxMain); }

function book(pid, src) {
  const day = D(db.active); if (!day) return;
  const s = { id: uid(), t: Date.now(), day: day.id, p: pid, src };
  db.scans.push(s); save();
  const p = P(pid), r = soll(day, pid), notLoaded = loaded(day, pid) === 0;
  $('last').className = 'last' + (notLoaded || r < 0 ? ' unk' : ''); $('last').hidden = false;
  $('last').innerHTML = '<div><b>' + esc(p.name) + ' gebucht</b><span>' +
    (notLoaded ? 'Heute nicht als mitgenommen eingetragen – bitte im Admin nachtragen.' : r < 0 ? 'Mehr gebucht als mitgenommen (' + r + ').' : 'Noch ' + r + ' übrig' + (r <= 3 ? ' – fast leer' : '')) +
    '</span></div><button class="b sm" data-undo="' + s.id + '">Rückgängig</button>';
  renderScan();
}
function onMainCode(code) {
  const p = byCode(code);
  if (!D(db.active)) return;
  if (p) { book(p.id, 'scan'); return; }
  $('last').className = 'last unk'; $('last').hidden = false;
  $('last').innerHTML = '<div><b>Unbekannter Barcode</b><span>' + esc(code) + ' – im Admin einem Getränk zuordnen.</span></div>';
}
$('last').addEventListener('click', e => {
  const u = e.target.closest('[data-undo]'); if (!u) return;
  db.scans = db.scans.filter(s => s.id !== u.dataset.undo); save(); $('last').hidden = true; renderScan(); toast('Buchung zurückgenommen');
});
$('list').addEventListener('click', e => { const b = e.target.closest('[data-plus]'); if (b) book(b.dataset.plus, 'manuell'); });
$('startBtn').addEventListener('click', async () => { setMsg(''); const err = await camStart(boxMain, onMainCode); if (err) setMsg(err); setMainButtons(); });
$('stopBtn').addEventListener('click', () => { camStop(); setMainButtons(); });

function renderScan() {
  const day = D(db.active);
  $('scanSec').hidden = !day; $('listSec').hidden = !day;
  if (!day) {
    if (cam.box === boxMain) camStop();
    $('dayInfo').innerHTML = '<div class="note"><b>Kein Tag aktiv.</b> Im Admin-Bereich einen Tag anlegen und die mitgenommenen Getränke eintragen.</div>';
    $('last').hidden = true; setMainButtons(); return;
  }
  const isToday = day.date === todayISO();
  $('dayInfo').innerHTML = '<div class="day-head"><b>' + esc(day.place || 'Ohne Ziel') + '</b><span>' + fmtDate(day.date) + '</span></div>' +
    (!isToday ? '<div class="note" style="margin-top:8px">Achtung: Gebucht wird auf den ' + fmtDate(day.date) + ', nicht auf heute.</div>' : '') +
    (day.closed ? '<div class="note bad" style="margin-top:8px">Dieser Tag ist abgeschlossen. Neue Buchungen landen trotzdem hier.</div>' : '');
  const rows = dayRows(day);
  $('list').innerHTML = rows.length ? rows.map(r => {
    const low = r.l > 0 && r.s <= 3;
    return '<div class="dr"><div class="nm"><b>' + esc(r.p.name) + '</b><small class="' + (low || r.s < 0 ? 'low' : '') + '">' + (r.l ? 'noch ' + r.s + ' von ' + r.l : 'nicht mitgenommen') + (r.p.price ? ' · ' + money(r.p.price) : '') + '</small></div>' +
      '<span class="cnt">' + r.u + '</span><button class="b sm" data-plus="' + r.p.id + '" aria-label="' + esc(r.p.name) + ' ohne Scan +1">+1</button><div class="tl">' + tally(r.u) + '</div></div>';
  }).join('') : '<div class="empty">Für diesen Tag ist noch nichts eingetragen.</div>';
  setMainButtons();
}

/* =========================================================
   Admin-Scan-Sheet: Produkt scannen → Flaschen/Kasten wählen
   ========================================================= */
const sh = { mode: 'load', dayId: null, pid: null, unknown: null, assignTo: null, minus: false, last: null };

async function openSheet(opts) {
  Object.assign(sh, { mode: 'load', pid: null, unknown: null, assignTo: null, minus: false, last: null }, opts);
  $('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  renderSheet();
  const err = await camStart(boxSheet, onSheetCode);
  if (err) { boxSheet.ph.innerHTML = '<span style="color:#fff">' + err + '</span>'; }
}
function closeSheet() {
  camStop();
  boxSheet.ph.innerHTML = '<b>Kamera startet …</b>';
  $('sheet').hidden = true; document.body.style.overflow = '';
  renderAdmin();
}
function onSheetCode(code) {
  const p = byCode(code);
  if (sh.mode === 'assign') {
    const target = sh.assignTo === 'new' ? null : P(sh.assignTo);
    if (p && p !== target) { toast('Barcode gehört schon zu „' + p.name + '“'); return; }
    if (sh.assignTo === 'new') newDraft.codes = (newDraft.codes ? newDraft.codes + ', ' : '') + code;
    else if (target && !target.codes.includes(code)) { target.codes.push(code); save(); }
    toast('Barcode übernommen'); closeSheet(); return;
  }
  if (p) { sh.pid = p.id; sh.unknown = null; } else { sh.pid = null; sh.unknown = code; }
  renderSheet();
}
function sheetAdd(pid, qty, label) {
  const day = D(sh.dayId); if (!day || !qty) return;
  const d = sh.minus ? -qty : qty, key = sh.mode === 'count' ? 'count' : 'load';
  const before = day[key][pid] == null ? null : day[key][pid];
  day[key][pid] = Math.max(0, (before || 0) + d);
  const entry = { id: uid(), t: Date.now(), p: pid, k: key, d: day[key][pid] - (before || 0), prev: before };
  day.log.push(entry); save();
  sh.last = { entry, text: (d > 0 ? '+' : '−') + Math.abs(d) + ' ' + P(pid).name + ' (' + label + ')' };
  toast(sh.last.text);
  renderSheet();
}
function undoLog(day, id) {
  const e = day.log.find(x => x.id === id); if (!e) return;
  const key = e.k;
  if (e.prev === null && (day[key][e.p] || 0) - e.d <= 0 && key === 'count') delete day[key][e.p];
  else day[key][e.p] = Math.max(0, (day[key][e.p] || 0) - e.d);
  day.log = day.log.filter(x => x !== e); save();
}
function renderSheet() {
  const day = D(sh.dayId), body = $('sheetBody');
  $('sheetMode').hidden = sh.mode === 'assign';
  $('sheetMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === sh.mode));
  if (sh.mode === 'assign') {
    const t = sh.assignTo === 'new' ? 'neues Getränk' : '„' + (P(sh.assignTo) || {}).name + '“';
    $('sheetTitle').textContent = 'Barcode für ' + t;
    body.innerHTML = '<div class="note">Halte den Barcode der Flasche oder des Kastens in den Rahmen.</div>';
    return;
  }
  $('sheetTitle').textContent = day ? dayLabel(day) : 'Tag';
  let h = '';
  if (sh.unknown) {
    h += '<div class="prod" style="border-color:var(--amb)"><div class="prod-h"><b>Neues Getränk</b><span>' + esc(sh.unknown) + '</span></div>' +
      '<div class="grid2"><label class="f full">Name<input id="qName" placeholder="z. B. Spezi 0,5 l"></label>' +
      '<label class="f">Preis pro Flasche in €<input id="qPrice" inputmode="decimal" placeholder="1,50"></label>' +
      '<label class="f">Gebinde<input id="qPacks" value="Kasten 20; Kasten 24"></label></div>' +
      '<div class="row" style="margin-top:0"><button class="b pri grow" data-sh="create">Anlegen</button><button class="b" data-sh="cancelNew">Abbrechen</button></div>' +
      '<div style="font-size:.84rem;color:var(--mu)">Oder diesen Barcode einem vorhandenen Getränk zuordnen:</div>' +
      '<div class="row" style="margin-top:0"><select id="qAssign"><option value="">Getränk wählen …</option>' + db.products.map(p => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('') + '</select><button class="b" data-sh="assignExisting">Zuordnen</button></div></div>';
  } else if (sh.pid) {
    const p = P(sh.pid), cur = sh.mode === 'count' ? counted(day, p.id) : loaded(day, p.id);
    const curTxt = sh.mode === 'count' ? 'gezählt' : 'mitgenommen';
    h += '<div class="prod"><div class="prod-h"><b>' + esc(p.name) + '</b><span><strong>' + (cur == null ? '–' : cur) + '</strong> ' + curTxt + '</span></div>' +
      '<div class="packs' + (sh.minus ? ' minus' : '') + '">' +
      '<button class="b" data-qty="1" data-l="Flasche">' + (sh.minus ? '−' : '+') + ' 1 Flasche<small>einzeln</small></button>' +
      p.packs.map(k => '<button class="b" data-qty="' + k.n + '" data-l="' + esc(k.l) + '">' + (sh.minus ? '−' : '+') + ' 1 ' + esc(k.l) + '<small>' + k.n + ' Flaschen</small></button>').join('') +
      '</div>' +
      '<div class="row" style="margin-top:0;align-items:center"><input id="qQty" inputmode="numeric" placeholder="Anzahl Flaschen" style="flex:1"><button class="b" data-sh="addQty">' + (sh.minus ? 'Abziehen' : 'Hinzufügen') + '</button></div>' +
      '<label class="chk"><input type="checkbox" id="qMinus"' + (sh.minus ? ' checked' : '') + '> Korrektur: abziehen statt hinzufügen</label>' +
      (p.packs.length ? '' : '<div style="font-size:.84rem;color:var(--mu)">Für Kästen unter „Getränke“ ein Gebinde eintragen, z. B. „Kasten 20“.</div>') +
      '</div>';
  } else {
    h += '<div class="note">' + (sh.mode === 'count' ? 'Scanne, was zurückgekommen ist, und tippe danach die Menge an.' : 'Scanne Flasche oder Kasten, dann die Menge antippen.') + '</div>';
  }
  if (!sh.unknown) {
    h += '<div class="row" style="margin-top:0"><select id="qPick"><option value="">Ohne Scan wählen …</option>' + db.products.map(p => '<option value="' + p.id + '"' + (p.id === sh.pid ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>';
  }
  if (sh.last) h += '<div class="last"><div><b style="font-size:1rem">' + esc(sh.last.text) + '</b></div><button class="b sm" data-sh="undo">Rückgängig</button></div>';
  if (day) {
    const rows = dayRows(day);
    if (rows.length) h += '<div style="font-size:.86rem;color:var(--mu)">' + (sh.mode === 'count' ? 'Gezählt bisher: ' + rows.filter(r => r.c != null).map(r => esc(r.p.name) + ' ' + r.c).join(', ') : 'Mitgenommen bisher: ' + rows.filter(r => r.l).map(r => esc(r.p.name) + ' ' + r.l).join(', ')) + '</div>';
  }
  body.innerHTML = h;
}
$('sheetClose').addEventListener('click', closeSheet);
$('sheetMode').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { sh.mode = b.dataset.m; sh.last = null; renderSheet(); } });
$('sheetBody').addEventListener('change', e => {
  if (e.target.id === 'qMinus') { sh.minus = e.target.checked; renderSheet(); }
  if (e.target.id === 'qPick' && e.target.value) { sh.pid = e.target.value; sh.unknown = null; renderSheet(); }
});
$('sheetBody').addEventListener('click', e => {
  const q = e.target.closest('[data-qty]');
  if (q && sh.pid) { sheetAdd(sh.pid, +q.dataset.qty, q.dataset.l); return; }
  const b = e.target.closest('[data-sh]'); if (!b) return;
  const a = b.dataset.sh;
  if (a === 'addQty') { const n = parseInt($('qQty').value); if (n > 0) sheetAdd(sh.pid, n, n === 1 ? 'Flasche' : 'Flaschen'); else toast('Bitte eine Anzahl eingeben'); }
  else if (a === 'undo' && sh.last) { undoLog(D(sh.dayId), sh.last.entry.id); toast('Zurückgenommen'); sh.last = null; renderSheet(); }
  else if (a === 'cancelNew') { sh.unknown = null; renderSheet(); }
  else if (a === 'create') {
    const name = $('qName').value.trim(); if (!name) { toast('Bitte einen Namen eingeben'); return; }
    const p = { id: uid(), name, codes: [sh.unknown], price: Math.max(0, num($('qPrice').value) || 0), packs: parsePacks($('qPacks').value) };
    db.products.push(p); save(); sh.pid = p.id; sh.unknown = null; toast('„' + name + '“ angelegt'); renderSheet();
  }
  else if (a === 'assignExisting') {
    const p = P($('qAssign').value); if (!p) { toast('Bitte ein Getränk wählen'); return; }
    if (!p.codes.includes(sh.unknown)) p.codes.push(sh.unknown); save(); sh.pid = p.id; sh.unknown = null; toast('Barcode zu „' + p.name + '“ hinzugefügt'); renderSheet();
  }
});

   Admin
   ========================================================= */
let adminOK = false, selDay = null, showNewDay = false, showNewProd = false;
let newDraft = { name: '', codes: '', price: '', packs: 'Kasten 20; Kasten 24' };

function setView(v) {
  if (cam.box === boxMain) camStop();
  $('v-scan').hidden = v !== 'scan'; $('v-admin').hidden = v !== 'admin';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'admin') renderAdmin(); else renderScan();
  window.scrollTo(0, 0);
}
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setMsg(''); setView(b.dataset.v); } });

function prevDay(dateISO) { return sortedDays().find(d => d.date < dateISO || (d.date === dateISO)) || null; }

function summary(day, rows) {
  if (!rows.length) return '<div class="note">Noch nichts eingetragen. Mit „Einladen per Scan“ die mitgenommenen Getränke erfassen.</div>';
  const drunk = rows.reduce((a, r) => a + r.u, 0), value = rows.reduce((a, r) => a + r.u * (r.p.price || 0), 0);
  const open = rows.filter(r => r.c == null).length, bad = rows.filter(r => r.diff !== null && r.diff !== 0);
  const missing = bad.filter(r => r.diff < 0).reduce((a, r) => a - r.diff, 0), extra = bad.filter(r => r.diff > 0).reduce((a, r) => a + r.diff, 0);
  const cost = bad.filter(r => r.diff < 0).reduce((a, r) => a - r.diff * (r.p.price || 0), 0);
  let h = '<div class="note ok">' + drunk + ' Getränke gebucht' + (value ? ', Wert ' + money(value) : '') + '.</div>';
  if (!open && !bad.length) h += '<div class="note ok"><b>Alles abgescannt.</b> Der gezählte Rest stimmt bei allen ' + rows.length + ' Getränken.</div>';
  else {
    let t = '';
    if (bad.length) t += '<b>' + bad.length + ' Abweichung' + (bad.length > 1 ? 'en' : '') + ':</b> ' + (missing ? missing + ' Flaschen nicht gescannt' + (cost ? ' (' + money(cost) + ')' : '') : '') + (missing && extra ? ', ' : '') + (extra ? extra + ' Flaschen mehr zurück als erwartet' : '') + '. ';
    if (open) t += open + ' von ' + rows.length + ' Getränken noch nicht gezählt.';
    h += '<div class="note ' + (missing ? 'bad' : '') + '">' + t + '</div>';
  }
  return h;
}

    h += '<section class="daylist"><h2>Alle Tage</h2>' + sortedDays().map(d => {
      const rs = dayRows(d), u = rs.reduce((a, r) => a + r.u, 0), miss = rs.reduce((a, r) => a + (r.diff != null && r.diff < 0 ? -r.diff : 0), 0);
      return '<div class="rw"><span>' + fmtDate(d.date) + '</span><span>' + esc(d.place || '–') + '</span><small>' + u + ' gebucht' + (miss ? ', ' + miss + ' fehlen' : '') + '</small>' + (d.id === db.active ? '<span class="tag act">aktiv</span>' : d.closed ? '<span class="tag cls">fertig</span>' : '') + '<button class="b sm" data-act="pickDay" data-id="' + d.id + '">Öffnen</button></div>';
    }).join('') + '</section>';
  }

  h += '<section><h2>Daten</h2><div class="row" style="margin-top:0">' +
    '<button class="b sm" data-act="csvAll">Alle Tage als CSV</button><button class="b sm" data-act="backup">Backup speichern</button><button class="b sm" data-act="restore">Backup laden</button>' +
    '<button class="b sm" data-act="pin">PIN ändern</button><button class="b sm" data-act="logout">Abmelden</button>' +
    (day ? '<button class="b sm dng" data-act="delDay">Diesen Tag löschen</button>' : '') + '</div>' +
    '<div style="font-size:.82rem;color:var(--mu);margin-top:8px">Die Daten liegen nur auf diesem Gerät. Speichere regelmäßig ein Backup.</div></section>';
  el.innerHTML = h;
}

function download(name, text, type) {
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type }));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const csvEsc = v => '"' + String(v).replace(/"/g, '""') + '"';
const dec = n => String(Math.round(n * 100) / 100).replace('.', ',');
function csvFor(days) {
  const rows = [['Datum', 'Ziel', 'Getränk', 'Mitgenommen', 'Gebucht', 'Soll-Rest', 'Gezählt', 'Differenz', 'Preis', 'Wert gebucht', 'Wert Differenz']];
  days.forEach(d => dayRows(d).forEach(r => rows.push([d.date, csvEsc(d.place), csvEsc(r.p.name), r.l, r.u, r.s, r.c == null ? '' : r.c, r.diff == null ? '' : r.diff, dec(r.p.price || 0), dec(r.u * (r.p.price || 0)), r.diff == null ? '' : dec(r.diff * (r.p.price || 0))])));
  return '﻿' + rows.map(r => r.join(';')).join('\n');
}

const adminBody = $('adminBody');
adminBody.addEventListener('input', e => { const n = e.target.dataset.n; if (n) newDraft[n] = e.target.value; });
adminBody.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pinIn') adminBody.querySelector('[data-act=login]').click(); });
adminBody.addEventListener('change', e => {
  const t = e.target, day = D(selDay);
  if (t.dataset.actSel === 'day') { selDay = t.value; showNewDay = false; renderAdmin(); return; }
  if (t.dataset.day && day) { if (t.dataset.day === 'date' && t.value) day.date = t.value; if (t.dataset.day === 'place') day.place = t.value.trim(); save(); renderAdmin(); return; }
  if (t.dataset.cnt && day) { const v = t.value.trim(); if (v === '' || isNaN(parseInt(v))) delete day.count[t.dataset.cnt]; else day.count[t.dataset.cnt] = Math.max(0, parseInt(v)); save(); renderAdmin(); return; }
  if (t.dataset.load && day) { day.load[t.dataset.load] = Math.max(0, parseInt(t.value) || 0); save(); renderAdmin(); return; }
  if (t.dataset.p) {
    const p = P(t.dataset.id); if (!p) return;
    if (t.dataset.p === 'name') p.name = t.value.trim() || p.name;
    if (t.dataset.p === 'codes') p.codes = parseCodes(t.value, p);
    if (t.dataset.p === 'price') p.price = Math.max(0, num(t.value) || 0);
    if (t.dataset.p === 'packs') p.packs = parsePacks(t.value);
    save(); renderAdmin(); return;
  }
});
adminBody.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act, id = b.dataset.id, day = D(selDay);
  if (a === 'login') { if ($('pinIn').value === db.pin) { adminOK = true; renderAdmin(); } else { toast('PIN falsch'); $('pinIn').value = ''; } }
  else if (a === 'logout') { adminOK = false; renderAdmin(); }
  else if (a === 'toggleNewDay') { showNewDay = !showNewDay; renderAdmin(); }
  else if (a === 'createDay') {
    const date = $('ndDate').value || todayISO(), place = $('ndPlace').value.trim();
    const nd = { id: uid(), date, place, note: '', closed: false, load: {}, count: {}, log: [] };
    const carry = $('ndCarry') && $('ndCarry').checked, pv = prevDay(todayISO());
    if (carry && pv) dayRows(pv).forEach(r => { const rest = r.c == null ? Math.max(0, r.s) : r.c; if (rest > 0) { nd.load[r.p.id] = rest; nd.log.push({ id: uid(), t: Date.now(), p: r.p.id, k: 'load', d: rest, prev: null }); } });
    db.days.push(nd); db.active = nd.id; selDay = nd.id; showNewDay = false; save(); renderAdmin(); toast('Tag angelegt und aktiviert');
  }
  else if (a === 'pickDay') { selDay = id; renderAdmin(); window.scrollTo(0, 0); }
  else if (a === 'activate' && day) { db.active = day.id; save(); renderAdmin(); toast('Scannen bucht jetzt auf diesen Tag'); }
  else if (a === 'close' && day) {
    const open = dayRows(day).filter(r => r.c == null).length;
    if (open && !confirm(open + ' Getränke sind noch nicht gezählt. Trotzdem abschließen?')) return;
    day.closed = true; save(); renderAdmin(); toast('Tag abgeschlossen');
  }
  else if (a === 'reopen' && day) { day.closed = false; save(); renderAdmin(); }
  else if (a === 'sheetLoad' && day) openSheet({ mode: 'load', dayId: day.id });
  else if (a === 'sheetCount' && day) openSheet({ mode: 'count', dayId: day.id });
  else if (a === 'zeroOpen' && day) { dayRows(day).forEach(r => { if (r.c == null) day.count[r.p.id] = 0; }); save(); renderAdmin(); }
  else if (a === 'csvDay' && day) download('getraenke-' + day.date + (day.place ? '-' + day.place.replace(/[^\wäöüÄÖÜß-]+/g, '_') : '') + '.csv', csvFor([day]), 'text/csv;charset=utf-8');
  else if (a === 'csvAll') download('getraenke-alle-tage-' + todayISO() + '.csv', csvFor(sortedDays().reverse()), 'text/csv;charset=utf-8');
  else if (a === 'storno') { db.scans = db.scans.filter(s => s.id !== id); save(); renderAdmin(); toast('Buchung storniert'); }
  else if (a === 'delDay' && day) {
    if (!confirm('„' + dayLabel(day) + '“ mit allen Buchungen löschen?')) return;
    db.scans = db.scans.filter(s => s.day !== day.id); db.days = db.days.filter(d => d !== day); if (db.active === day.id) db.active = null; selDay = null; save(); renderAdmin();
  }
  else if (a === 'assign') openSheet({ mode: 'assign', assignTo: id });
  else if (a === 'toggleNewProd') { showNewProd = !showNewProd; renderAdmin(); }
  else if (a === 'addProd') {
    const name = newDraft.name.trim(); if (!name) { toast('Bitte einen Namen eingeben'); return; }
    const p = { id: uid(), name, codes: [], price: Math.max(0, num(newDraft.price) || 0), packs: parsePacks(newDraft.packs) };
    p.codes = parseCodes(newDraft.codes, p); db.products.push(p); save();
    newDraft = { name: '', codes: '', price: '', packs: 'Kasten 20; Kasten 24' }; showNewProd = false; renderAdmin(); toast('Getränk angelegt');
  }
  else if (a === 'delProd') {
    const p = P(id); if (!p) return;
    const n = db.scans.filter(s => s.p === id).length;
    if (!confirm('„' + p.name + '“ löschen?' + (n ? ' ' + n + ' Buchungen hängen daran und werden mit gelöscht.' : ''))) return;
    db.products = db.products.filter(x => x !== p); db.scans = db.scans.filter(s => s.p !== id);
    db.days.forEach(d => { delete d.load[id]; delete d.count[id]; d.log = d.log.filter(l => l.p !== id); }); save(); renderAdmin();
  }
  else if (a === 'backup') download('strichliste-backup-' + todayISO() + '.json', JSON.stringify(db), 'application/json');
  else if (a === 'restore') $('fileIn').click();
  else if (a === 'pin') { const p = prompt('Neue PIN (mindestens 4 Ziffern):'); if (p && /^\d{4,}$/.test(p)) { db.pin = p; save(); renderAdmin(); toast('PIN geändert'); } else if (p) toast('Bitte mindestens 4 Ziffern'); }
});
$('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!Array.isArray(d.products) || !Array.isArray(d.days) || !Array.isArray(d.scans)) throw 0;
    if (!confirm('Backup laden? Die Daten auf diesem Gerät werden ersetzt.')) return;
    db = Object.assign({ pin: '1234', active: null }, d); selDay = null; save(); renderAdmin(); toast('Backup geladen');
  } catch (err) { toast('Die Datei ist kein gültiges Backup'); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.on) { const wasSheet = cam.box === boxSheet; camStop(); setMainButtons(); if (wasSheet) boxSheet.ph.innerHTML = '<b>Kamera pausiert</b><span>Schließen und erneut öffnen.</span>'; } });

renderScan();
if (location.hash === '#admin') setView('admin');
</script>
